version: 2

models:
  - name: int_manufacturer_names
    description: Every distinct manufacturer / firm name in payments, recalls and adverse events, with its occurrence count and rule-based comparison key. One row per (source_system, raw_name).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, raw_name]
    columns:
      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['payments', 'recalls', 'adverse_events']
      - name: raw_name
        data_tests:
          - not_null
      - name: name_key
        description: Output of `normalize_firm_name` (parent rolled up, suffixes stripped).
        data_tests:
          - not_null

  - name: int_manufacturer_resolution
    description: >
      Maps every raw manufacturer name in every source to one conformed manufacturer, with
      subsidiaries and divisions rolled up to the parent. Feeds `dim_manufacturers`.
      Rows with a `review_candidate_key` are near-matches that were NOT merged and need a
      human decision (confirm by adding a row to the `manufacturer_aliases` seed).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, raw_name]
    columns:
      - name: manufacturer_key
        description: md5 of `manufacturer_match_key`; the conformed manufacturer id.
        data_tests:
          - not_null
      - name: manufacturer_name
        description: Display name (payments spelling preferred, then recalls, then events).
        data_tests:
          - not_null
      - name: match_method
        description: How the name was resolved - rule, alias (seed) or fuzzy.
        data_tests:
          - accepted_values:
              arguments:
                values: ['rule', 'alias', 'fuzzy']

  - name: int_drug_names
    description: Every distinct drug name in payments (product slots 1-5), adverse events (as reported) and recalls, with occurrence count and comparison key. One row per (source_system, raw_name).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, raw_name]
    columns:
      - name: source_system
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['payments', 'recalls', 'adverse_events']
      - name: raw_name
        data_tests:
          - not_null
      - name: name_key
        description: Output of `normalize_drug_name` (strengths, dosage forms and salts removed).
        data_tests:
          - not_null

  - name: int_drug_dictionary
    description: Name -> generic (active ingredient) dictionary learned from openFDA-enriched adverse-event rows and recalls, falling back to the reporter's active-substance field. One row per name_key; the most frequent generic wins.
    columns:
      - name: name_key
        data_tests:
          - unique
          - not_null
      - name: generic_key
        data_tests:
          - not_null

  - name: int_drug_resolution
    description: >
      Maps every raw drug name in every source to one conformed drug (active ingredient), so
      brand names roll up to their generic. Feeds `dim_drugs`. Conforming at ingredient level
      means brands of one ingredient (Ozempic, Wegovy, Rybelsus) share a `drug_key`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, raw_name]
    columns:
      - name: drug_key
        description: md5 of `drug_match_key`; the conformed drug id.
        data_tests:
          - not_null
      - name: generic_name
        description: Normalized generic (active ingredient) name; the same value for every row of a drug_key.
        data_tests:
          - not_null
      - name: match_method
        description: dictionary (known name), generic (name is itself a known generic) or name (nothing known; stands for itself).
        data_tests:
          - accepted_values:
              arguments:
                values: ['dictionary', 'generic', 'name']

  - name: int_recall_drug_names
    description: The drug name of each recall - openFDA brand name, else generic name, else the first phrase of the product description. One row per recall; shared by int_drug_names and fct_recalls.
    columns:
      - name: recall_number
        data_tests: [unique, not_null]

  - name: int_recall_reason_categories
    description: One row per recall with a rule-based risk category for its free-text reason (macros/classify_recall_reason.sql).
    columns:
      - name: recall_number
        data_tests: [unique, not_null]
      - name: recall_reason_category
        data_tests: [not_null]

unit_tests:
  - name: test_classify_recall_reason
    description: The first matching rule wins, so a non-sterile cGMP deviation is a sterility problem.
    model: int_recall_reason_categories
    given:
      - input: ref('stg_recalls')
        rows:
          - {recall_number: R1, recall_reason: "Lack of Assurance of Sterility"}
          - {recall_number: R2, recall_reason: "CGMP Deviations: Non-Sterility found in lots"}
          - {recall_number: R3, recall_reason: "Presence of foreign substance: small metallic particles"}
          - {recall_number: R4, recall_reason: "Subpotent Drug"}
          - {recall_number: R5, recall_reason: "CGMP Deviations: presence of N-Nitroso Atomoxetine Impurity"}
          - {recall_number: R6, recall_reason: "Failed Dissolution Specifications"}
          - {recall_number: R7, recall_reason: "Marketed without an approved NDA/ANDA"}
          - {recall_number: R8, recall_reason: "CGMP Deviations"}
          - {recall_number: R9, recall_reason: "Something unusual"}
          - {recall_number: R10, recall_reason: null}
          - {recall_number: R11, recall_reason: "Defective container: cracked cartridges"}
          - {recall_number: R12, recall_reason: "Discoloration: yellow spots on tablets"}
    expect:
      rows:
        - {recall_number: R1, recall_reason_category: sterility_microbial}
        - {recall_number: R2, recall_reason_category: sterility_microbial}
        - {recall_number: R3, recall_reason_category: foreign_matter}
        - {recall_number: R4, recall_reason_category: potency}
        - {recall_number: R5, recall_reason_category: chemical_contamination}
        - {recall_number: R6, recall_reason_category: quality_stability}
        - {recall_number: R7, recall_reason_category: unapproved_or_adulterated}
        - {recall_number: R8, recall_reason_category: cgmp_deviation}
        - {recall_number: R9, recall_reason_category: other}
        - {recall_number: R10, recall_reason_category: unspecified}
        - {recall_number: R11, recall_reason_category: labeling_packaging}
        - {recall_number: R12, recall_reason_category: quality_stability}

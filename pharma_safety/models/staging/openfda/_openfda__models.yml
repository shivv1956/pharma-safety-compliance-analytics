version: 2

models:
  - name: stg_adverse_events
    description: One row per FAERS safety report (latest load wins if a report was loaded twice). Flags are cast to booleans, dates to DATE.
    columns:
      - name: adverse_event_report_id
        description: openFDA `safetyreportid`.
        data_tests:
          - unique
          - not_null
      - name: received_date
        description: Date FDA received the report (the incremental cursor of the ingestion).
        data_tests:
          - not_null
      - name: is_serious
        description: True when the report is flagged serious. Null when the source omitted the flag.

  - name: stg_adverse_event_drugs
    description: One row per drug on a FAERS report. Drug names are as reported (not yet conformed).
    columns:
      - name: adverse_event_drug_id
        description: dlt row id of the drug entry.
        data_tests:
          - unique
          - not_null
      - name: adverse_event_report_id
        description: Parent report.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adverse_events')
                field: adverse_event_report_id
      - name: drug_role
        description: suspect, concomitant or interacting.
        data_tests:
          - accepted_values:
              arguments:
                values: ['suspect', 'concomitant', 'interacting']

  - name: stg_adverse_event_reactions
    description: One row per reaction on a FAERS report (MedDRA preferred term).
    columns:
      - name: adverse_event_reaction_id
        description: dlt row id of the reaction entry.
        data_tests:
          - unique
          - not_null
      - name: adverse_event_report_id
        description: Parent report.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_adverse_events')
                field: adverse_event_report_id

  - name: stg_recalls
    description: One row per classified drug recall (deduplicated on recall_number). Recalls FDA has not yet classified have no recall number and are excluded.
    columns:
      - name: recall_number
        description: openFDA recall number, the primary key.
        data_tests:
          - unique
          - not_null
      - name: recall_classification
        description: Class I (most severe) to Class III (least severe).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Class I', 'Class II', 'Class III']
      - name: report_date
        description: Date the recall was reported (the incremental cursor of the ingestion).
        data_tests:
          - not_null

  - name: stg_adverse_event_drug_manufacturers
    description: Manufacturer name(s) openFDA matched to each FAERS drug, one row per array element. Position 0 is the primary manufacturer. Large (~170M rows) - filter or aggregate.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [adverse_event_drug_id, manufacturer_position]
    columns:
      - name: adverse_event_drug_id
        data_tests: [not_null]
      - name: manufacturer_name
        data_tests: [not_null]

  - name: stg_adverse_event_drug_generics
    description: Generic (active ingredient) name(s) openFDA matched to each FAERS drug, one row per array element. Position 0 is used as the drug's generic.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [adverse_event_drug_id, generic_position]
    columns:
      - name: adverse_event_drug_id
        data_tests: [not_null]
      - name: generic_name
        data_tests: [not_null]

  - name: stg_recall_openfda_names
    description: First brand and generic name openFDA matched to each recall (about half of recalls have any). Join to stg_recalls on recall_source_row_id = _source_row_id.
    columns:
      - name: recall_source_row_id
        data_tests: [unique, not_null]

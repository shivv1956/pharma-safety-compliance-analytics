version: 2

sources:
  - name: openfda
    description: openFDA drug adverse events (FAERS) and drug recalls, landed by dlt (`ingestion/fda_pipeline.py`).
    database: pharma_source
    schema: openfda
    # dlt tables have `_dlt_load_id` (epoch seconds of the load), not a loaded-at timestamp.
    config:
      loaded_at_field: "to_timestamp_ntz(_dlt_load_id::number(38,6))"
    tables:
      - name: adverse_events
        description: One row per FAERS safety report.
        # FAERS is published in batches and lags real time by months; a daily run with
        # no new data loads nothing, so these thresholds are deliberately wide.
        config:
          freshness:
            warn_after: {count: 45, period: day}
            error_after: {count: 120, period: day}
      - name: adverse_events__patient__drug
        description: One row per drug on a report (child of adverse_events via `_dlt_parent_id`).
      - name: adverse_events__patient__reaction
        description: One row per reaction on a report (child of adverse_events via `_dlt_parent_id`).
      - name: adverse_events__patient__drug__openfda__manufacturer_name
        description: Manufacturer name(s) openFDA matched to a drug (value + parent link). ~170M rows; used only through stg_adverse_event_drug_manufacturers.
      - name: adverse_events__patient__drug__openfda__generic_name
        description: Generic name(s) openFDA matched to a drug (value + parent link). Used through stg_adverse_event_drug_generics.
      - name: recalls
        description: One row per drug enforcement (recall) record.
        config:
          freshness:
            warn_after: {count: 14, period: day}
            error_after: {count: 45, period: day}
      - name: recalls__openfda__brand_name
        description: Brand name(s) openFDA matched to a recall (value + parent link). Used through stg_recall_openfda_names.
      - name: recalls__openfda__generic_name
        description: Generic name(s) openFDA matched to a recall (value + parent link). Used through stg_recall_openfda_names.

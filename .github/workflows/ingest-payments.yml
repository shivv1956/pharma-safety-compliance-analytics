name: Ingest CMS Open Payments (bulk CSV)

on:
  schedule:
    - cron: "0 7 1 * *" # 1st of every month, 07:00 UTC
  workflow_dispatch:
    inputs:
      program_year:
        description: Override the CMS_PAYMENTS_YEAR variable for this run (blank = use the variable)
        default: ""
      max_rows:
        description: Stop after this many rows (0 = the whole year; use a small number to test)
        default: "0"
      skip_rows:
        description: Resume an interrupted load, skipping this many already-loaded rows (see the "loaded N rows" log lines)
        default: "0"

concurrency:
  group: ingest-cms
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: ingestion
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Stream and load the yearly CSV
        working-directory: ingestion
        run: >
          uv run python payments_bulk_pipeline.py
          --year "${{ inputs.program_year || vars.CMS_PAYMENTS_YEAR || '2025' }}"
          --max-rows "${{ inputs.max_rows || '0' }}"
          --skip-rows "${{ inputs.skip_rows || '0' }}"
        env:
          DESTINATION__SNOWFLAKE__CREDENTIALS__HOST: ${{ secrets.SNOWFLAKE_HOST }}
          DESTINATION__SNOWFLAKE__CREDENTIALS__USERNAME: ${{ secrets.SNOWFLAKE_USER }}
          DESTINATION__SNOWFLAKE__CREDENTIALS__PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          DESTINATION__SNOWFLAKE__CREDENTIALS__WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          DESTINATION__SNOWFLAKE__CREDENTIALS__ROLE: INGEST_ROLE
          DESTINATION__SNOWFLAKE__CREDENTIALS__DATABASE: PHARMA_SOURCE
          SOURCES__FDA_PIPELINE__API_KEY: ${{ secrets.OPENFDA_API_KEY }}

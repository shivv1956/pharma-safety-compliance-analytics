name: Backfill openFDA adverse events (manual)

# One-off history load, one quarter per job, run one after another so the
# loads never overlap. Daily runs start at 2026-06-01, so history ends 2026-05-31.
on:
  workflow_dispatch:

concurrency:
  group: ingest-openfda
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: ingestion
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        window:
          - { from: "20240101", to: "20240331" }
          - { from: "20240401", to: "20240630" }
          - { from: "20240701", to: "20240930" }
          - { from: "20241001", to: "20241231" }
          - { from: "20250101", to: "20250331" }
          - { from: "20250401", to: "20250630" }
          - { from: "20250701", to: "20250930" }
          - { from: "20251001", to: "20251231" }
          - { from: "20260101", to: "20260331" }
          - { from: "20260401", to: "20260531" }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Backfill ${{ matrix.window.from }} to ${{ matrix.window.to }}
        working-directory: ingestion
        run: uv run python fda_pipeline.py --from ${{ matrix.window.from }} --to ${{ matrix.window.to }}
        env:
          DESTINATION__SNOWFLAKE__CREDENTIALS__HOST: ${{ secrets.SNOWFLAKE_HOST }}
          DESTINATION__SNOWFLAKE__CREDENTIALS__USERNAME: ${{ secrets.SNOWFLAKE_USER }}
          DESTINATION__SNOWFLAKE__CREDENTIALS__PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          DESTINATION__SNOWFLAKE__CREDENTIALS__WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          DESTINATION__SNOWFLAKE__CREDENTIALS__ROLE: INGEST_ROLE
          DESTINATION__SNOWFLAKE__CREDENTIALS__DATABASE: PHARMA_SOURCE
          SOURCES__FDA_PIPELINE__API_KEY: ${{ secrets.OPENFDA_API_KEY }}

# Used by the GitHub Actions dbt workflows (DBT_PROFILES_DIR=ci). Credentials come from secrets.
pharma_safety:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'DBT_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'DBT_WH') }}"
      database: "{{ env_var('DBT_DATABASE', 'PHARMA_TEST') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'ci') }}"
      threads: 4
